# 方案 A：WebUI + Cloak/Camoufox 有头浏览器（Xvfb）
#
#   cp .env.example .env    # 填写 WEBUI_AUTH_CODE、CHATGPT2API_AUTH_KEY 等
#   docker compose up --build
#   WebUI：http://127.0.0.1:5000
#   看浏览器窗口：http://127.0.0.1:6080/vnc.html
#
# Resin / chatgpt2api 默认不随 WebUI 启动。启用方式二选一：
#   1) .env 里设置 COMPOSE_PROFILES=resin,chatgpt2api
#   2) docker compose --profile resin --profile chatgpt2api up --build
# Resin 管理台：http://127.0.0.1:2260
# chatgpt2api 控制台：http://127.0.0.1:3000
#
# 注册驱动跟 .env / WebUI 配置走（不要在这个镜像里选 Roxy/Chromix）。
# Docker Desktop / Colima 建议至少 8GB 内存。
# 不要用 docker compose down -v 做日常停止：会删掉 chatgpt2api-runtime 命名卷。

services:
  webui:
    build: .
    image: turb-gpt-free-register:cloak
    ports:
      - "5000:5000"
      - "6080:6080"
    shm_size: "2gb"
    init: true
    security_opt:
      # grok-register 同样设置。Docker 默认 seccomp 会拦 Firefox 内容进程 syscall，标签页变成 Gah. Your tab just crashed。
      - seccomp=unconfined
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TURB_IN_DOCKER: "1"
      DISPLAY: ":99"
      CLOAK_HEADLESS: "False"
      CAMOUFOX_HEADLESS: "False"
      CAMOUFOX_HUMANIZE: "False"
      CODEX_OAUTH_DRIVER: same_as_registration
      CLOAKBROWSER_CACHE_DIR: /opt/cloakbrowser
      XDG_CACHE_HOME: /opt/camoufox-cache
      # 容器访问同 compose 的 chatgpt2api；.env 里非空 CHATGPT2API_API_BASE 优先。
      CHATGPT2API_API_BASE: ${CHATGPT2API_API_BASE:-http://chatgpt2api}
    volumes:
      # 代码、.env、turb.sqlite3、注册日志都走宿主机目录，容器重启不丢数据。
      - .:/app
    entrypoint: ["/app/docker-entrypoint.sh"]
    command: ["python", "web.py", "--host", "0.0.0.0", "--port", "5000"]

  # https://github.com/Resinat/Resin
  # 粘性代理网关。WebUI 容器内模板示例：
  #   PROXY_RESIN_TEMPLATE=http://openai.[task_任务id]:${RESIN_PROXY_TOKEN}@resin:2260
  # 宿主机跑 WebUI 时把主机名换成 127.0.0.1。
  resin:
    image: ghcr.io/resinat/resin:latest
    profiles: ["resin"]
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      RESIN_ADMIN_TOKEN: ${RESIN_ADMIN_TOKEN:-changeme}
      # 必须定义；不需要代理密码时在 .env 里写成 RESIN_PROXY_TOKEN=
      RESIN_PROXY_TOKEN: ${RESIN_PROXY_TOKEN:-changeme}
      RESIN_LISTEN_ADDRESS: 0.0.0.0
      RESIN_PORT: ${RESIN_PORT:-2260}
      # Docker Desktop/Colima 的默认 proxies 会把 127.0.0.1:7890 注入容器，容器内连不上。
      # 需要走宿主机代理时在 .env 设 SIDECAR_HTTP_PROXY=socks5://host.docker.internal:7890
      HTTP_PROXY: ${SIDECAR_HTTP_PROXY:-}
      HTTPS_PROXY: ${SIDECAR_HTTPS_PROXY:-${SIDECAR_HTTP_PROXY:-}}
      ALL_PROXY: ${SIDECAR_ALL_PROXY:-${SIDECAR_HTTP_PROXY:-}}
      http_proxy: ${SIDECAR_HTTP_PROXY:-}
      https_proxy: ${SIDECAR_HTTPS_PROXY:-${SIDECAR_HTTP_PROXY:-}}
      all_proxy: ${SIDECAR_ALL_PROXY:-${SIDECAR_HTTP_PROXY:-}}
      NO_PROXY: ${SIDECAR_NO_PROXY:-localhost,127.0.0.1,chatgpt2api,resin,webui}
      no_proxy: ${SIDECAR_NO_PROXY:-localhost,127.0.0.1,chatgpt2api,resin,webui}
    ports:
      - "${RESIN_PORT:-2260}:2260"
    volumes:
      - resin_cache:/var/cache/resin
      - resin_state:/var/lib/resin
      - resin_log:/var/log/resin
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2260/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # https://github.com/revoke0699/chatgpt2api （镜像沿用 ghcr.io/yukkcat/chatgpt2api）
  # 管理台 / OpenAI 兼容 API。内部监听 80，对外默认 3000。
  # 启动前请在 .env 填写 CHATGPT2API_AUTH_KEY。
  chatgpt2api:
    image: ${CHATGPT2API_IMAGE:-ghcr.io/yukkcat/chatgpt2api:latest}
    profiles: ["chatgpt2api"]
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${CHATGPT2API_PORT:-3000}:80"
    volumes:
      - chatgpt2api-runtime:/app
      - chatgpt2api-data:/app/data
      - ./docker/chatgpt2api/config.json:/app/config.json
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      CHATGPT2API_AUTH_KEY: ${CHATGPT2API_AUTH_KEY:-}
      CHATGPT2API_BASE_URL: ${CHATGPT2API_BASE_URL:-http://127.0.0.1:3000}
      CHATGPT2API_THREAD_TOKENS: ${CHATGPT2API_THREAD_TOKENS:-120}
      TZ: ${TZ:-Asia/Shanghai}
      HTTP_PROXY: ${SIDECAR_HTTP_PROXY:-}
      HTTPS_PROXY: ${SIDECAR_HTTPS_PROXY:-${SIDECAR_HTTP_PROXY:-}}
      ALL_PROXY: ${SIDECAR_ALL_PROXY:-${SIDECAR_HTTP_PROXY:-}}
      http_proxy: ${SIDECAR_HTTP_PROXY:-}
      https_proxy: ${SIDECAR_HTTPS_PROXY:-${SIDECAR_HTTP_PROXY:-}}
      all_proxy: ${SIDECAR_ALL_PROXY:-${SIDECAR_HTTP_PROXY:-}}
      NO_PROXY: ${SIDECAR_NO_PROXY:-localhost,127.0.0.1,chatgpt2api,resin,webui}
      no_proxy: ${SIDECAR_NO_PROXY:-localhost,127.0.0.1,chatgpt2api,resin,webui}

volumes:
  chatgpt2api-runtime:
  chatgpt2api-data:
  resin_cache:
  resin_state:
  resin_log:
